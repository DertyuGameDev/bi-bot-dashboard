name: Checks and Docker build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install uv==0.11.28
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: JavaScript syntax
        run: find MY shared tests/browser -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Shell syntax
        run: find scripts docker -name '*.sh' -print0 | xargs -0 -n 1 sh -n
      - run: docker compose --env-file .env.docker.example config --quiet
      - run: docker build -t bi-bot-dashboard:ci .
